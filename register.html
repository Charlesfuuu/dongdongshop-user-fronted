<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=9; IE=8; IE=7; IE=EDGE">
	<meta http-equiv="X-UA-Compatible" content="IE=EmulateIE7" />
	<title>个人注册</title>


    <link rel="stylesheet" type="text/css" href="css/webbase.css" />
    <link rel="stylesheet" type="text/css" href="css/pages-register.css" />
</head>

<body>
	<div class="register py-container ">
		<!--head-->
		<div class="logoArea">
			<a href="" class="logo-bd"></a>
		</div>
		<!--register-->
		<div id="app" class="registerArea">
			<h3>注册新用户<span class="go">我有账号，去<a href="login.html" target="_blank">登陆</a></span></h3>
			<div class="info">
				<form class="sui-form form-horizontal">
					<div class="control-group">
						<label class="control-label">用户名：</label>
						<div class="controls">
							<input type="text" v-model="registerForm.username" placeholder="请输入你的用户名" class="input-xfat input-xlarge">
						</div>
					</div>
					<div class="control-group">
						<label for="password" class="control-label">登录密码：</label>
						<div class="controls">
							<input id="password" v-model="registerForm.password" type="password" placeholder="设置登录密码" class="input-xfat input-xlarge">
						</div>
					</div>
					<div class="control-group">
						<label for="repassword" class="control-label">确认密码：</label>
						<div class="controls">
							<input id="repassword" v-model="registerForm.repassword" type="password" placeholder="再次确认密码" class="input-xfat input-xlarge">
						</div>
					</div>
					
					<div class="control-group">
						<label class="control-label">手机号：</label>
						<div class="controls">
							<input type="text" v-model="registerForm.phone" placeholder="请输入你的手机号" class="input-xfat input-xlarge">
						</div>
					</div>
					<div class="control-group">
						<label for="code" class="control-label">短信验证码：</label>
						<div class="controls">
							<input id="code" v-model="registerForm.code" type="text" placeholder="短信验证码" class="input-xfat input-xlarge">  <a @click="codeBtn" href="#">获取短信验证码</a>
						</div>
					</div>
					
					<div class="control-group">
						<label for="inputPassword" class="control-label">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
						<div class="controls">
							<input name="m1" type="checkbox" value="2" checked=""><span>同意协议并注册《东东商城用户协议》</span>
						</div>
					</div>
					<div class="control-group">
						<label class="control-label"></label>
						<div class="controls btn-reg">
							<input type="button" value="注册" @click="register" >
						</div>
					</div>
				</form>
				<div class="clearfix"></div>
			</div>
		</div>
		<!--foot-->
		<div class="py-container copyright">
			<ul>
				<li>关于我们</li>
				<li>联系我们</li>
				<li>联系客服</li>
				<li>商家入驻</li>
				<li>营销中心</li>
				<li>手机东东商城</li>
				<li>销售联盟</li>
				<li>东东商城社区</li>
			</ul>
			<div class="address">地址：北京市昌平区沙阳路18号 邮编：100000 电话：400-0123-302</div>
			<div class="beian">京ICP备08006666号京公网安备11010888888
			</div>
		</div>
	</div>


<script type="text/javascript" src="js/plugins/jquery/jquery.min.js"></script>
<script type="text/javascript" src="js/plugins/jquery.easing/jquery.easing.min.js"></script>
<script type="text/javascript" src="js/plugins/sui/sui.min.js"></script>
<script type="text/javascript" src="js/plugins/jquery-placeholder/jquery.placeholder.min.js"></script>
<script type="text/javascript" src="js/pages/register.js"></script>
<script src="js/common/vue.js"></script>
<script src="js/common/axios.js"></script>
<script src="js/common/config.js"></script>

<script>
	new Vue({
		el:"#app",
		data:{
			registerForm:{
				username:"",
				password:"",
				repassword:"",
				phone:"",
				code:""
			}
		},
		methods:{
			register(){
				this.$http.post('/user/register',this.registerForm).then(res=>{
					if(res.data.code=="200"){
						alert("注册成功");
						location.href="login.html";
					}else{
						alert(res.data.message);
					}
				})
			},
			codeBtn(){
				this.$http.get('/sms/phoneCode/'+this.registerForm.phone).then(res=>{
					if(res.data.code=="200"){
						alert("发送成功");
					}else{
						alert(res.data.message);
					}
				})
			}
		}
	});
</script>

</body>

</html>
